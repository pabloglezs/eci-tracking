<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECI Tracker · Histórico de precios de El Corte Inglés</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">ECI <span>Tracker</span></a>
      <input type="search" id="q" placeholder="Buscar producto…" aria-label="Buscar producto">
    </div>
  </header>
  <main class="wrap">
    <form id="add" class="add" novalidate>
      <label for="add-url" class="add-label">Seguir un producto nuevo</label>
      <div class="add-row">
        <input type="url" id="add-url" placeholder="Pega la URL de un producto de elcorteingles.es" autocomplete="off" inputmode="url">
        <button class="primary" type="submit" id="add-btn">Seguir precio</button>
      </div>
      <p id="add-msg" class="msg" role="status" aria-live="polite"></p>
    </form>

    <nav id="cats" class="chips" aria-label="Categorías"></nav>
    <nav id="subs" class="chips chips-sub" aria-label="Subcategorías"></nav>

    <div class="toolbar">
      <h1 id="title">Productos seguidos</h1>
      <div class="controls">
        <label class="check"><input type="checkbox" id="deals-only"> Sólo ofertas</label>
        <label class="sort">Ordenar
          <select id="sort">
            <option value="drop">Mayor bajada</option>
            <option value="recent">Más recientes</option>
            <option value="price_asc">Precio: menor a mayor</option>
            <option value="price_desc">Precio: mayor a menor</option>
            <option value="near_min">Cerca del mínimo histórico</option>
          </select>
        </label>
      </div>
    </div>
    <p id="count" class="muted count" aria-live="polite"></p>
    <div id="list" class="grid"></div>
    <div class="more"><button id="more" type="button" hidden>Cargar más</button></div>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
