<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECI Tracker · Histórico de precios de El Corte Inglés</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">ECI <span>Tracker</span></a>
      <input type="search" id="q" placeholder="Buscar producto…" aria-label="Buscar producto">
    </div>
  </header>
  <main class="wrap">
    <h1>🔥 Ofertas</h1>
    <p class="muted" style="margin-top:-8px">Productos que han bajado de precio en los últimos 7 días.</p>
    <div id="deals" class="grid"></div>

    <h2>Todos los productos seguidos</h2>
    <div id="all" class="grid"></div>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
