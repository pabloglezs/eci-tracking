services:
  app:
    build: .
    image: eci-tracking:latest
    container_name: eci-tracking
    restart: unless-stopped
    ports:
      # BIND_ADDR limita desde dónde se puede entrar. Con un túnel de Cloudflare
      # que apunta a 172.17.0.1, pon BIND_ADDR=172.17.0.1 para no exponerlo a la LAN.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      PORT: 3000
      # URL pública de la app (se usa en los enlaces de los emails).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Comprobación diaria de precios (cron, en la zona horaria TZ).
      CHECK_CRON: ${CHECK_CRON:-0 7 * * *}
      CHECK_ON_START: ${CHECK_ON_START:-false}
      # Pon true si hay un reverse proxy delante (para el rate limit por IP).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Token para lanzar POST /api/admin/check a mano. Vacío = desactivado.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Email (alertas de bajada de precio)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-ECI Tracker <no-reply@localhost>}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-false}
      # Backups de la BD (VACUUM INTO). BACKUP_CRON=off los desactiva.
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Límites por IP de POST /api/products (por minuto, por día y productos nuevos por día).
      TRACK_PER_MINUTE: ${TRACK_PER_MINUTE:-30}
      TRACK_PER_DAY: ${TRACK_PER_DAY:-200}
      TRACK_NEW_PER_DAY: ${TRACK_NEW_PER_DAY:-30}
      SUBSCRIBE_PER_MINUTE: ${SUBSCRIBE_PER_MINUTE:-10}
      # Scraper: pausa entre peticiones a ECI, reintentos y descatalogados.
      REQUEST_DELAY_MIN_MS: ${REQUEST_DELAY_MIN_MS:-2000}
      REQUEST_DELAY_MAX_MS: ${REQUEST_DELAY_MAX_MS:-6000}
      SCRAPE_RETRIES: ${SCRAPE_RETRIES:-2}
      SCRAPE_BACKOFF_MS: ${SCRAPE_BACKOFF_MS:-3000}
      GONE_AFTER: ${GONE_AFTER:-3}
      GONE_RECHECK_DAYS: ${GONE_RECHECK_DAYS:-7}
      # Aviso al admin si una pasada diaria falla en bloque (vacío = desactivado).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_ALERT_FAIL_PCT: ${ADMIN_ALERT_FAIL_PCT:-50}
      ADMIN_ALERT_MIN_SAMPLE: ${ADMIN_ALERT_MIN_SAMPLE:-3}
      # Alertas por email: caducidad de confirmaciones, tope por dirección y purga de la cola.
      CONFIRM_TTL_DAYS: ${CONFIRM_TTL_DAYS:-7}
      CONFIRM_MAX_PER_EMAIL_DAY: ${CONFIRM_MAX_PER_EMAIL_DAY:-5}
      QUEUE_SENT_RETENTION_DAYS: ${QUEUE_SENT_RETENTION_DAYS:-30}
      QUEUE_FAILED_RETENTION_DAYS: ${QUEUE_FAILED_RETENTION_DAYS:-60}
    volumes:
      - eci-data:/data
      # Volumen aparte para los backups: si se pierde/corrompe eci-data siguen ahí.
      # Para protegerte de perder el disco, pon BACKUP_PATH a una ruta del host en
      # OTRO disco (p. ej. BACKUP_PATH=/mnt/nas/eci-backups) y será un bind mount.
      - ${BACKUP_PATH:-eci-backups}:/data/backups

volumes:
  eci-data:
  eci-backups:
